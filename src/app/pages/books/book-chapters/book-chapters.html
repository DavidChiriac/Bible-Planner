<div [ngClass]="utils.isMobile() ? 'container-mobile' : 'container'">
    <div class="mt-3 flex justify-content-between w-100 align-items-center" [ngClass]="{'px-3': !utils.isMobile()}">
        <p-button label="Back" class="go-back" (onClick)="goBack()"><i class="pi pi-arrow-left"></i></p-button>

        @if (utils.isEntireDayRead(book()?.chapters ?? [])) {
            <p-button label="Mark All as Unread" class="mark-as-unread" (onClick)="utils.markAllAsUnread(book()?.chapters ?? [])"></p-button>
        } @else {
            <p-button label="Mark All as Read" class="mark-as-read" (onClick)="utils.markAllAsRead(book()?.chapters ?? [])"></p-button>
        }
    </div>
    <h1 class="w-full px-5 text-center book-title">{{ book()?.title }}</h1>
    <div class="chapters-container flex flex-1 flex-wrap gap-3 row-gap-3 m-auto justify-content-center mb-3" [ngClass]="utils.isMobile() ? 'w-full px-2' : 'w-6'">
        @for (chapter of book()?.chapters ?? []; track $index) {
            <div
                class="flex w-full justify-content-between align-items-center cursor-pointer chapter"
                [ngClass]="utils.isMobile() ? 'gap-2' : 'gap-6'"
                (click)="utils.toggleChapterRead(chapter)" onkeydown="">
                <div class="flex gap-2">
                    <p-checkbox
                        [binary]="true"
                        [ngModel]="utils.isEntireDayRead([chapter])"></p-checkbox>
                    <h3 class="m-0">{{ chapter }}</h3>
                </div>
                <i class="pi pi-pencil" (click)="$event.stopPropagation(); viewChapterNotes(chapter)" onkeydown=""></i>
            </div>
        }
    </div>
</div>
