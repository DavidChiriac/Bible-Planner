<div [ngClass]="utils.isMobile ? 'container-mobile' : 'container'">
    <div class="w-100 mt-5 flex flex-column align-items-center gap-3 justify-content-center" [ngClass]="{'mobile': utils.isMobile}">
        <div class="flex align-items-center" [ngClass]="{'gap-3': !utils.isMobile, 'mt-5 flex-column': utils.isMobile}">
            <label for="start-date">Data de început:</label>
            @if (utils.isMobile) {
                <br/>
            }
            <p-datepicker [(ngModel)]="utils.startDate" dateFormat="dd/mm/yy" placeholder="dd/mm/yyyy" pInputMask="99/99/9999" (ngModelChange)="setStartDate($event)"></p-datepicker>
        </div>
        <div class="flex align-items-center" [ngClass]="{'gap-3': !utils.isMobile, 'mt-3 flex-column': utils.isMobile}">
            <label for="number-of-months">Numărul de luni:</label>
            @if (utils.isMobile) {
                <br/>
            }
            <input id="number-of-months" type="number" min="1" pInputText [ngModel]="utils.months()" (ngModelChange)="setMonths($event)"
                autocomplete="off" />
        </div>
        <div class="mt-6">
            <p-button (onClick)="resetProgress()" class="reset-progress">Reset Progress</p-button>
        </div>
    </div>
</div>

<p-dialog header="Resetează Progresul" [modal]="true" [(visible)]="resetConfirmationVisible" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">Ești sigur că vrei să resetezi progresul?</span>
    <div class="flex justify-end gap-2">
        <p-button label="Anulează" class="cancel-reset-progress" (onClick)="resetConfirmationVisible = false"></p-button>
        <p-button label="Confirmă" class="confirm-reset-progress" (onClick)="confirmResetProgress()"></p-button>
    </div>
</p-dialog>
