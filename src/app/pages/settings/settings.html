<div [ngClass]="utils.isMobile() ? 'container-mobile' : 'container'">
    <div class="w-100 mt-5 flex flex-column align-items-center gap-3 justify-content-center" [ngClass]="{'mobile': utils.isMobile()}">
        <div class="language-section" [ngClass]="{'mt-3': !utils.isMobile(), 'mt-4': utils.isMobile()}">
            <label class="palette-label">{{ i18n.t('settings.language') }}</label>
            <div class="lang-grid">
                @for (lang of i18n.languages; track lang.id) {
                    <button
                        class="lang-btn"
                        [class.active]="i18n.lang() === lang.id"
                        (click)="setLanguage(lang.id)"
                        [attr.aria-label]="lang.label"
                        [attr.aria-pressed]="i18n.lang() === lang.id">
                        <span class="lang-flag">{{ lang.id === 'ro' ? '🇷🇴' : '🇬🇧' }}</span>
                        <span class="lang-name">{{ lang.label }}</span>
                    </button>
                }
            </div>
        </div>

        <div class="mt-6">
            <p-button (onClick)="resetProgress()" class="reset-progress">{{ i18n.t('settings.resetProgress') }}</p-button>
        </div>
        @if (utils.customPlanConfig()) {
          <div class="mt-3">
              <p-button (onClick)="deleteCustomPlan()" class="delete-plan" severity="danger" [outlined]="true">{{ i18n.t('settings.deleteCustomPlan') }}</p-button>
          </div>
        }
    </div>
</div>

<p-dialog [header]="i18n.t('settings.resetDialogHeader')" [modal]="true" [(visible)]="resetConfirmationVisible" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-2">{{ i18n.t('settings.resetDialogConfirm') }}</span>
    <span class="p-text-secondary block mb-8 font-italic">{{ i18n.t('settings.resetDialogNote') }}</span>
    <div class="flex justify-content-center gap-2">
        <p-button [label]="i18n.t('common.confirm')" class="confirm-reset-progress" (onClick)="confirmResetProgress()"></p-button>
        <p-button [label]="i18n.t('common.cancel')" class="cancel-reset-progress" (onClick)="resetConfirmationVisible = false"></p-button>
    </div>
</p-dialog>

<p-dialog [header]="i18n.t('settings.deletePlanDialogHeader')" [modal]="true" [(visible)]="deletePlanVisible" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">{{ i18n.t('settings.deletePlanDialogConfirm') }}</span>
    <div class="flex justify-content-center gap-2">
        <p-button [label]="i18n.t('common.confirm')" class="confirm-reset-progress" severity="danger" (onClick)="confirmDeleteCustomPlan()"></p-button>
        <p-button [label]="i18n.t('common.cancel')" class="cancel-reset-progress" (onClick)="deletePlanVisible = false"></p-button>
    </div>
</p-dialog>
