<div class="w-100 flex flex-column align-items-center mt-5 overflow-auto" [ngClass]="utils.isMobile() ? 'container-mobile' : 'container'">
    <h1>Bine ai venit la Bible Planner!</h1>
    <p-button
        label="Login with Google"
        (onClick)="auth.login()"
        class="mt-3">
    </p-button>

    @if (auth.errors().length > 0) {
        <div class="w-100">
            @for (error of auth.errors(); track $index) {
                <p>{{ error | json }}</p>
            }
        </div>
    }
</div>
