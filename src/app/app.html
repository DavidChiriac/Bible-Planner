@if (utils.loading()) {
  <div class="loading-screen" [class.mobile]="utils.isMobile">
    <img src="/assets/images/Bible Planner.png" alt="Bible Planner"/>
  </div>
} @else {
  @if (auth.isLoggedIn()) {
    <app-navbar></app-navbar>
  }
  <router-outlet></router-outlet>
  @if (auth.isLoggedIn()) {
    <app-footer></app-footer>
  }
}
