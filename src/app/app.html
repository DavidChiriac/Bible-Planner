@if (!isOnline()) {
  <div class="offline-overlay">
    <div class="offline-content">
      <i class="pi pi-wifi"></i>
      <h2>Fără conexiune la internet</h2>
      <p>Verifică conexiunea la internet și încearcă din nou.</p>
    </div>
  </div>
} @else if (utils.loading()) {
  <div class="loading-screen" [class.mobile]="utils.isMobile()">
    <img src="assets/images/Bible Planner.png" alt="Bible Agenda"/>
    <div class="loading-skeleton">
      <div class="skeleton-bar"></div>
      <div class="skeleton-bar short"></div>
      <div class="skeleton-bar"></div>
    </div>
  </div>
} @else {
  @if (auth.isLoggedIn()) {
    <app-navbar></app-navbar>
  }
  <div class="app-content">
    <router-outlet></router-outlet>
  </div>
  @if (auth.isLoggedIn()) {
    <app-footer></app-footer>
  }
}
