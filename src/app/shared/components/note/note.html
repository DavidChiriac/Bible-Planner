<div class="w-full note">
    @if (displayChapterLabel()) {
        <div class="flex justify-content-between align-items-center mb-2">
            <div class="flex gap-2 align-items-center">
                <h3 class="m-0">{{ note().chapterLabel }}</h3>
            </div>
            <div class="flex gap-1">
                <i class="pi pi-trash icon-action-btn icon-action-btn--danger" (click)="deleteNote()" onkeydown=""></i>
                <i class="pi pi-pencil icon-action-btn" (click)="editNote()" onkeydown=""></i>
            </div>
        </div>
    }
    @if (note().tags?.length) {
        <div class="flex gap-1 flex-wrap mb-2">
            @for (tag of note().tags; track tag) {
                <span class="note-tag" [style.background]="getTagColor(tag) + '22'" [style.color]="getTagColor(tag)" [style.border-color]="getTagColor(tag)">
                    <i [class]="getTagIcon(tag)" style="font-size: 0.7rem"></i>
                    {{ getTagLabel(tag) }}
                </span>
            }
        </div>
    }
    <div class="flex gap-3 w-full justify-content-between align-items-start">
        <div class="note-content" [innerHTML]="note().text.replaceAll('&amp;nbsp;', ' ')"></div>

        @if (!displayChapterLabel()) {
            <div class="flex gap-1">
                <i
                    class="pi pi-trash icon-action-btn icon-action-btn--danger"
                    (click)="deleteNote()"
                    onkeydown=""></i>
                <i class="pi pi-pencil icon-action-btn" (click)="editNote()" onkeydown=""></i>
            </div>
        }
    </div>
    <div class="font-italic w-full text-right mt-2 note-text">
        {{ note().createdDate | date: 'dd-MM-yyyy HH:mm' }}
    </div>
</div>

<p-dialog
    [header]="i18n.t('note.deleteDialogHeader')"
    [modal]="true"
    [(visible)]="noteDeleteDialogVisible"
    [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">{{ i18n.t('note.deleteConfirm') }}</span>
    <div class="flex justify-content-center gap-2">
        <p-button
            [label]="i18n.t('common.confirm')"
            class="confirm-reset-progress"
            (onClick)="confirmDelete()"></p-button>
        <p-button
            [label]="i18n.t('common.cancel')"
            class="cancel-reset-progress"
            (onClick)="noteDeleteConfirmation.set(null); noteDeleteDialogVisible.set(false)"></p-button>
    </div>
</p-dialog>
<p-dialog [header]="i18n.t('note.editDialogHeader')"
    [modal]="true"
    [(visible)]="editMode"
    [style]="{ width: utils.isMobile() ? '90%' : '50%' }"
    [ngClass]="utils.isMobile() ? 'edit-dialog-mobile' : ''">
    <div class="flex flex-column align-items-start gap-3 mb-6 mt-1">
        <quill-editor theme="snow" class="w-full note-editor" [(ngModel)]="editedText" [modules]="{toolbar: [['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['clean']]}"></quill-editor>
        <div class="w-full">
            <label for="edit-note-tags" class="block mb-1">{{ i18n.t('common.tags') }}</label>
            <p-multiselect
                id="edit-note-tags"
                [options]="tagOptions"
                optionLabel="label"
                optionValue="value"
                appendTo="body"
                [filter]="false"
                [pt]="tagsPt"
                [placeholder]="i18n.t('common.addTags')"
                [panelStyleClass]="'multiselect-panel'"
                [(ngModel)]="editedTags">
            </p-multiselect>
        </div>
    </div>

    <div class="flex justify-content-center gap-2">
        <p-button
            [label]="i18n.t('note.saveBtnLabel')"
            class="confirm-reset-progress"
            (onClick)="confirmEdit()"></p-button>
        <p-button
            [label]="i18n.t('common.cancel')"
            class="cancel-reset-progress"
            (onClick)="editMode.set(false); editedText.set('')"></p-button>
    </div>

</p-dialog>
