<div class="book-card" [ngClass]="{'completed': isCompleted(), 'mobile': utils.isMobile, 'in-progress': progress() > 0 && progress() < 100}">
    <div class="icon">
        <img [src]="'assets/icons/open-book.png'" alt="Book Cover" class="book-cover" />
    </div>
    <div class="book-info flex flex-column">
        <div class="w-9">
            <p-progressbar [value]="progress()" [showValue]="false"/>
        </div>
        <h3 class="text-center">{{ book()?.title }}</h3>
    </div>

    @if (isCompleted()) {
        <div class="overlay">
            <i class="circled pi pi-check"></i>
        </div>
    }

    @if (progress() > 0 && progress() < 100) {
        <div [ngClass]="utils.isMobile ? 'mobile-overlay' : 'overlay'">
            <i class="pi pi-clock"></i>
        </div>
    }
</div>
